<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 예산 현황 및 취합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
        
        /* 로딩 오버레이 스타일 */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay">
        <div class="spinner mb-4"></div>
        <p class="text-gray-700 font-semibold" id="loadingText">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">📊 팀 예산 관리 시스템</h1>
            <p class="text-gray-500 mt-2">부장님 보고용 월별 예산 취합 및 대시보드</p>
        </header>

        <div class="flex border-b border-gray-200 mb-8">
            <button onclick="switchTab('input')" id="tab-input" class="px-6 py-2 font-semibold transition-colors tab-active">데이터 입력</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-6 py-2 font-semibold text-gray-500 hover:text-blue-600 transition-colors">전체 대시보드</button>
        </div>

        <!-- Section 1: Input Form -->
        <div id="section-input" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 card p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="mr-2">📝</span> 내역 입력
                </h2>
                <form id="budgetForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">팀원 선택</label>
                        <div class="flex mt-1">
                            <select id="member" class="block w-full rounded-l-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="">팀원을 선택하세요</option>
                                <!-- JS dynamic options -->
                            </select>
                            <button type="button" onclick="openAddMemberPrompt()" class="bg-gray-100 text-gray-700 px-4 rounded-r-md border border-l-0 border-gray-300 hover:bg-gray-200 transition-colors whitespace-nowrap">
                                + 추가
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">해당 월</label>
                        <input type="month" id="month" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">예산 항목</label>
                        <select id="category" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="수선유지비">수선유지비</option>
                            <option value="비품">비품</option>
                            <option value="개량공사">개량공사</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">사용 금액 (원)</label>
                        <input type="number" id="amount" placeholder="숫자만 입력" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                        기록 저장하기
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 card p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">📂 최근 입력 내역</h2>
                    <div class="space-x-2">
                        <button onclick="fetchData()" class="text-xs text-blue-500 hover:underline">새로고침</button>
                        <button onclick="requestClearData()" class="text-xs text-red-500 hover:underline">모든 데이터 초기화</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">날짜</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">팀원</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">항목</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">금액</th>
                                <th class="px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody id="historyBody" class="bg-white divide-y divide-gray-200">
                            <!-- JS dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Section 2: Dashboard (Hidden by default) -->
        <div id="section-dashboard" class="hidden space-y-8">
            
            <!-- AI 요약 섹션 -->
            <div class="card p-6 bg-yellow-50 border-l-4 border-yellow-400">
                <h2 class="text-lg font-bold mb-2 flex items-center">
                    <span class="mr-2">💡</span> 데이터 분석 요약
                </h2>
                <p id="dashboard-summary" class="text-gray-700 leading-relaxed">
                    데이터를 분석 중입니다...
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6 bg-blue-50">
                    <p class="text-sm text-blue-600 font-semibold">전체 누적 사용액</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-blue-900 mt-1">0원</h3>
                </div>
                <div class="card p-6 bg-green-50">
                    <p class="text-sm text-green-600 font-semibold">이번 달 최대 사용 항목</p>
                    <h3 id="stat-top-category" class="text-xl font-bold text-green-900 mt-1">-</h3>
                </div>
                <div class="card p-6 bg-purple-50">
                    <p class="text-sm text-purple-600 font-semibold">데이터 건수</p>
                    <h3 id="stat-count" class="text-3xl font-bold text-purple-900 mt-1">0건</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4">🏠 항목별 예산 분포</h2>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4">👥 팀원별 누적 사용액</h2>
                    <canvas id="memberChart"></canvas>
                </div>
            </div>

            <div class="card p-6 overflow-x-auto">
                <h2 class="text-lg font-bold mb-4">📅 월별/항목별 요약 테이블 (취합본)</h2>
                <table class="min-w-full border-collapse border border-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border border-gray-200 px-4 py-2">연월</th>
                            <th class="border border-gray-200 px-4 py-2 text-blue-600">수선유지비</th>
                            <th class="border border-gray-200 px-4 py-2 text-green-600">비품</th>
                            <th class="border border-gray-200 px-4 py-2 text-purple-600">개량공사</th>
                            <th class="border border-gray-200 px-4 py-2 bg-gray-200">합계</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="text-center">
                        <!-- JS dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="customAlert" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-2" id="alertTitle">알림</h3>
            <p id="alertMsg" class="text-gray-600 mb-4"></p>
            <button onclick="closeAlert()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">확인</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="customConfirm" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-2 text-red-600">확인 요청</h3>
            <p id="confirmMsg" class="text-gray-600 mb-4"></p>
            <div class="flex space-x-2">
                <button onclick="closeConfirm()" class="w-1/2 bg-gray-200 text-gray-800 py-2 rounded font-bold hover:bg-gray-300 transition-colors">취소</button>
                <button id="confirmBtn" class="w-1/2 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- Prompt Modal (Add Member) -->
    <div id="customPrompt" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-2">➕ 새 팀원 추가</h3>
            <p class="text-sm text-gray-500 mb-2">추가할 팀원의 이름을 입력해주세요.</p>
            <input type="text" id="promptInput" class="w-full border border-gray-300 rounded p-2 mb-4 focus:ring-blue-500 focus:border-blue-500" placeholder="예: 팀원5">
            <div class="flex space-x-2">
                <button onclick="closePrompt()" class="w-1/2 bg-gray-200 text-gray-800 py-2 rounded font-bold hover:bg-gray-300 transition-colors">취소</button>
                <button onclick="submitAddMember()" class="w-1/2 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition-colors">추가</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 주의: 아래 SCRIPT_URL을 본인의 앱스 스크립트 웹앱 URL로 변경해야 합니다!
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSTMKG-gqqRNXUqxhnU-Ktkyrmj391RUj1xbsK8bFzWsthKBWt60PKQbpWdz7HGLoI/exec'; 
        
        // State Management
        let budgetData = []; // DB에서 로드
        let teamMembers = JSON.parse(localStorage.getItem('teamMembers')) || ["부장님", "팀원1", "팀원2", "팀원3", "팀원4"];
        let categoryChart = null;
        let memberChart = null;
        let pendingConfirmAction = null;

        // UI Helpers
        function showLoading(text = '처리 중...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Custom Modals Controls
        function showAlert(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
        }
        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function showConfirm(msg, onConfirm) {
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmAction = onConfirm;
            document.getElementById('customConfirm').classList.remove('hidden');
        }
        function closeConfirm() {
            document.getElementById('customConfirm').classList.add('hidden');
            pendingConfirmAction = null;
        }
        document.getElementById('confirmBtn').addEventListener('click', () => {
            if (pendingConfirmAction) pendingConfirmAction();
            closeConfirm();
        });

        // Add Member Prompt Logic
        function renderTeamMembers() {
            const select = document.getElementById('member');
            select.innerHTML = '<option value="">팀원을 선택하세요</option>' + 
                teamMembers.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        function openAddMemberPrompt() {
            document.getElementById('promptInput').value = '';
            document.getElementById('customPrompt').classList.remove('hidden');
            document.getElementById('promptInput').focus();
        }
        function closePrompt() {
            document.getElementById('customPrompt').classList.add('hidden');
        }
        function submitAddMember() {
            const newMember = document.getElementById('promptInput').value.trim();
            if (newMember !== "") {
                if (!teamMembers.includes(newMember)) {
                    teamMembers.push(newMember);
                    localStorage.setItem('teamMembers', JSON.stringify(teamMembers));
                    renderTeamMembers();
                    closePrompt();
                    showAlert('성공', `'${newMember}' 팀원이 목록에 추가되었습니다.`);
                    document.getElementById('member').value = newMember; // 자동 선택
                } else {
                    showAlert('알림', '이미 존재하는 팀원입니다.');
                }
            }
        }

        // Fetch data from Google Sheets API
        async function fetchData() {
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                showAlert('설정 오류', 'Google Apps Script URL이 설정되지 않았습니다.');
                renderHistory();
                return;
            }

            showLoading('데이터를 불러오는 중입니다...');
            try {
                const response = await fetch(SCRIPT_URL + "?action=read");
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success') {
                    budgetData = result.data.map(row => ({
                        id: row.id || Date.now(),
                        member: row.member,
                        month: row.month,
                        category: row.category,
                        amount: parseInt(row.amount)
                    }));

                    // 데이터에 존재하는 멤버 자동 추가
                    budgetData.forEach(item => {
                        if (item.member && !teamMembers.includes(item.member)) {
                            teamMembers.push(item.member);
                        }
                    });
                    localStorage.setItem('teamMembers', JSON.stringify(teamMembers));
                    renderTeamMembers();

                    renderHistory();
                    if(document.getElementById('section-dashboard').classList.contains('hidden') === false) {
                        updateDashboard();
                    }
                } else {
                    showAlert('오류', '데이터를 불러오는데 실패했습니다: ' + result.message);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showAlert('통신 오류', '서버와 통신 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        // Tab Switching
        function switchTab(tab) {
            const sections = ['input', 'dashboard'];
            sections.forEach(s => {
                document.getElementById(`section-${s}`).classList.add('hidden');
                document.getElementById(`tab-${s}`).classList.remove('tab-active');
                document.getElementById(`tab-${s}`).classList.add('text-gray-500');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');

            if(tab === 'dashboard') {
                updateDashboard();
            }
        }

        // Form Submission (Add Data via API)
        document.getElementById('budgetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newEntry = {
                id: Date.now().toString(),
                member: document.getElementById('member').value,
                month: document.getElementById('month').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            };

            showLoading('데이터를 저장하는 중입니다...');
            
            try {
                const formData = new FormData();
                formData.append('action', 'insert');
                formData.append('id', newEntry.id);
                formData.append('member', newEntry.member);
                formData.append('month', newEntry.month);
                formData.append('category', newEntry.category);
                formData.append('amount', newEntry.amount);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    newEntry.amount = parseInt(newEntry.amount);
                    budgetData.unshift(newEntry);
                    renderHistory();
                    this.reset();
                    
                    const now = new Date();
                    document.getElementById('month').value = now.toISOString().substring(0, 7);
                    showAlert('성공', '예산 데이터가 성공적으로 저장되었습니다.');
                } else {
                    showAlert('저장 실패', result.message);
                }
            } catch (error) {
                console.error('Error saving data:', error);
                showAlert('통신 오류', '데이터 저장 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        });

        function requestDeleteEntry(id) {
            showConfirm('이 내역을 삭제하시겠습니까?', () => executeDeleteEntry(id));
        }

        async function executeDeleteEntry(id) {
            showLoading('삭제 중...');
            try {
                const formData = new FormData();
                formData.append('action', 'delete');
                formData.append('id', id);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    budgetData = budgetData.filter(item => item.id.toString() !== id.toString());
                    renderHistory();
                    showAlert('성공', '삭제되었습니다.');
                } else {
                    showAlert('삭제 실패', result.message);
                }
            } catch (error) {
                console.error('Error deleting data:', error);
                showAlert('통신 오류', '삭제 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        function requestClearData() {
            showConfirm('정말로 모든 데이터를 삭제하시겠습니까?\n(이 작업은 DB에서도 즉시 삭제되며 되돌릴 수 없습니다.)', executeClearData);
        }

        async function executeClearData() {
            showLoading('전체 데이터 삭제 중...');
            try {
                const formData = new FormData();
                formData.append('action', 'clearAll');

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    budgetData = [];
                    renderHistory();
                    showAlert('성공', '모든 데이터가 초기화되었습니다.');
                } else {
                    showAlert('초기화 실패', result.message);
                }
            } catch (error) {
                console.error('Error clearing data:', error);
                showAlert('통신 오류', '초기화 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        function renderHistory() {
            const body = document.getElementById('historyBody');
            body.innerHTML = budgetData.map(item => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-sm text-gray-600">${item.month}</td>
                    <td class="px-4 py-3 text-sm font-semibold text-gray-800">${item.member}</td>
                    <td class="px-4 py-3 text-sm">
                        <span class="px-2 py-1 rounded-full text-xs font-medium 
                            ${item.category === '수선유지비' ? 'bg-blue-100 text-blue-800' : 
                              item.category === '비품' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800'}">
                            ${item.category}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-sm text-right font-mono">${item.amount.toLocaleString()}원</td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="requestDeleteEntry('${item.id}')" class="text-red-400 hover:text-red-600">🗑️</button>
                    </td>
                </tr>
            `).join('');
            
            if(budgetData.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-gray-400">등록된 데이터가 없습니다.</td></tr>`;
            }
        }

        // Dashboard Logic
        function generateAISummary(total, count, catMap, memMap) {
            if (count === 0) return "현재 등록된 예산 데이터가 없어 분석이 불가능합니다.";
            
            const topCat = Object.keys(catMap).length > 0 ? Object.keys(catMap).reduce((a, b) => catMap[a] > catMap[b] ? a : b) : '-';
            const topMem = Object.keys(memMap).length > 0 ? Object.keys(memMap).reduce((a, b) => memMap[a] > memMap[b] ? a : b) : '-';
            
            return `현재까지 총 <strong>${count}건</strong>의 내역이 등록되었으며, 누적 사용액은 <strong>${total.toLocaleString()}원</strong>입니다.<br/>
                    전체 기간 동안 가장 지출이 많은 항목은 <strong>${topCat}</strong>(${catMap[topCat]?.toLocaleString() || 0}원)이며, 
                    누적 예산을 가장 많이 사용한 팀원은 <strong>${topMem}</strong>(${memMap[topMem]?.toLocaleString() || 0}원)입니다.`;
        }

        function updateDashboard() {
            const total = budgetData.reduce((acc, curr) => acc + curr.amount, 0);
            document.getElementById('stat-total').innerText = total.toLocaleString() + '원';
            document.getElementById('stat-count').innerText = budgetData.length + '건';

            // Category aggregation
            const catMap = budgetData.reduce((acc, curr) => {
                acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
                return acc;
            }, {});
            
            // Member aggregation
            const memMap = budgetData.reduce((acc, curr) => {
                acc[curr.member] = (acc[curr.member] || 0) + curr.amount;
                return acc;
            }, {});
            
            const topCategory = Object.keys(catMap).length > 0 ? Object.keys(catMap).reduce((a, b) => catMap[a] > catMap[b] ? a : b) : '-';
            document.getElementById('stat-top-category').innerText = topCategory !== '-' ? `${topCategory} (${catMap[topCategory].toLocaleString()}원)` : '-';

            // Update AI Summary Text
            document.getElementById('dashboard-summary').innerHTML = generateAISummary(total, budgetData.length, catMap, memMap);

            // Charts
            renderCharts(catMap, memMap);
            renderSummaryTable();
        }

        function renderCharts(catMap, memMap) {
            const catCtx = document.getElementById('categoryChart').getContext('2d');
            const memCtx = document.getElementById('memberChart').getContext('2d');

            if(categoryChart) categoryChart.destroy();
            if(memberChart) memberChart.destroy();

            categoryChart = new Chart(catCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, cutout: '70%' }
            });

            memberChart = new Chart(memCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(memMap),
                    datasets: [{
                        label: '사용 금액',
                        data: Object.values(memMap),
                        backgroundColor: '#60a5fa'
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, grid: { display: false } } }
                }
            });
        }

        function renderSummaryTable() {
            const tableBody = document.getElementById('summaryTableBody');
            const monthlyData = {};

            budgetData.forEach(item => {
                if(!monthlyData[item.month]) {
                    monthlyData[item.month] = { '수선유지비': 0, '비품': 0, '개량공사': 0, total: 0 };
                }
                monthlyData[item.month][item.category] += item.amount;
                monthlyData[item.month].total += item.amount;
            });

            const sortedMonths = Object.keys(monthlyData).sort((a, b) => b.localeCompare(a));

            tableBody.innerHTML = sortedMonths.map(month => {
                const row = monthlyData[month];
                return `
                    <tr>
                        <td class="border border-gray-200 px-4 py-2 font-semibold">${month}</td>
                        <td class="border border-gray-200 px-4 py-2">${row['수선유지비'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2">${row['비품'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2">${row['개량공사'].toLocaleString()}</td>
                        <td class="border border-gray-200 px-4 py-2 bg-gray-50 font-bold">${row.total.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
            
            if(sortedMonths.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-gray-400">데이터가 없습니다.</td></tr>`;
            }
        }

        window.onload = function() {
            const now = new Date();
            const monthStr = now.toISOString().substring(0, 7);
            document.getElementById('month').value = monthStr;
            
            renderTeamMembers();
            fetchData();
        }
    </script>
</body>
</html>
